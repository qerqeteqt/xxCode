<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xxCode</title>
<style>
  /* 主题用 CSS 变量切换 —— 只有这一处定义颜色，别的地方一律引用变量。
     这样加一个主题就是加一组变量，不用去改任何组件样式。 */
  :root[data-theme="dark"] {
    --bg: #0d1117; --panel: #161b22; --raised: #1c2128; --hover: #21262d;
    --border: #30363d; --text: #e6edf3; --dim: #8b949e;
    --accent: #58a6ff; --accent-fg: #0d1117; --accent-soft: rgba(88,166,255,.14);
    --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --code-bg: #010409;
    /* 渐变单独一组。所有渐变都从这里取，换个主题就是换一组值 ——
       和颜色变量是同一个道理，组件里不出现写死的渐变色 */
    --glow-1: rgba(88,166,255,.13);
    --glow-2: rgba(163,113,247,.11);
    --grad-brand: linear-gradient(118deg, #61b0ff 0%, #a371f7 100%);
    --grad-panel: linear-gradient(180deg, #181e27 0%, #11151b 100%);
    --grad-btn: linear-gradient(135deg, #2f81f7 0%, #6a5af9 100%);
    --grad-bubble: linear-gradient(135deg, rgba(88,166,255,.13), rgba(163,113,247,.07));
    --grad-active: linear-gradient(90deg, rgba(88,166,255,.24), rgba(163,113,247,.10));
    --grad-card: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0));
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --panel: #f6f8fa; --raised: #ffffff; --hover: #eef1f4;
    --border: #d0d7de; --text: #1f2328; --dim: #656d76;
    --accent: #0969da; --accent-fg: #ffffff; --accent-soft: rgba(9,105,218,.10);
    --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
    --code-bg: #f6f8fa;
    --glow-1: rgba(9,105,218,.07);
    --glow-2: rgba(130,80,223,.06);
    --grad-brand: linear-gradient(118deg, #0969da 0%, #8250df 100%);
    --grad-panel: linear-gradient(180deg, #f9fbfd 0%, #f1f4f8 100%);
    --grad-btn: linear-gradient(135deg, #0a6ee0 0%, #6f42c1 100%);
    --grad-bubble: linear-gradient(135deg, rgba(9,105,218,.09), rgba(130,80,223,.05));
    --grad-active: linear-gradient(90deg, rgba(9,105,218,.16), rgba(130,80,223,.08));
    --grad-card: linear-gradient(180deg, rgba(255,255,255,.9), rgba(0,0,0,.012));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    /* 两个角落各放一团很淡的辉光，再压到底色上。纯色大面积铺开太平了，
       但辉光也不能浓 —— 超过 15% 就会抢正文的注意力 */
    background:
      radial-gradient(880px 520px at 12% -10%, var(--glow-1), transparent 68%),
      radial-gradient(760px 460px at 92% 108%, var(--glow-2), transparent 68%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
  }
  code, pre, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  button {
    background: var(--raised); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px;
    font-family: inherit;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary {
    background: var(--grad-btn); color: #fff; border-color: transparent;
    box-shadow: 0 1px 8px -2px var(--glow-1);
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.12); border-color: transparent; }

  /* ================= 左侧会话栏 ================= */
  .sidebar {
    width: 264px; flex: none; display: flex; flex-direction: column;
    background: var(--grad-panel); border-right: 1px solid var(--border);
    transition: margin-left .18s ease;
  }
  .sidebar .top { padding: 12px; border-bottom: 1px solid var(--border); }
  .sidebar .brand {
    font-weight: 600; letter-spacing: .3px; display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 10px;
  }
  /* 渐变文字：background-clip 把背景裁进字形里 */
  .sidebar .brand > span:first-child {
    background: var(--grad-brand);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; font-size: 15px;
  }
  .sidebar .brand .ver { color: var(--dim); font-size: 11px; font-weight: 400; }
  #newChat { width: 100%; text-align: center; }
  .side-list { flex: 1; overflow-y: auto; padding: 8px; }
  .day {
    color: var(--dim); font-size: 11px; padding: 10px 8px 4px;
    position: sticky; top: 0; background: var(--panel);
  }
  /* 一条会话就一行。多余的细节塞进 title 属性，鼠标悬停才看。
     用 div 而不是 button —— 里面还要放一个「⋯」按钮，button 不能嵌 button */
  .conv {
    position: relative; display: block; width: 100%; text-align: left;
    border: 1px solid transparent; background: none; border-radius: 6px;
    /* 右边留 30px 给「⋯」，不留的话长标题会被它盖住 */
    padding: 7px 30px 7px 9px; cursor: pointer;
    color: var(--text); font-size: 13px; line-height: 1.4; margin-bottom: 1px;
    font-family: inherit;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .conv:hover { background: var(--hover); border-color: transparent; }
  .conv.active {
    background: var(--grad-active); border-color: transparent;
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .conv .more {
    position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    padding: 0 6px; font-size: 15px; line-height: 1.5;
    border: none; background: none; color: var(--dim); border-radius: 4px;
    opacity: 0; transition: opacity .1s;
  }
  /* 平时藏起来，鼠标移到这条上、或菜单开着时才显示 */
  .conv:hover .more, .conv .more.on { opacity: 1; }
  .conv .more:hover { background: var(--raised); color: var(--text); }

  /* 菜单挂到 body 上、用 fixed 定位 —— 放列表里面会被 overflow 裁掉 */
  .menu {
    position: fixed; z-index: 40; min-width: 148px;
    background: var(--raised); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px;
    box-shadow: 0 10px 30px -8px rgba(0,0,0,.55);
    display: flex; flex-direction: column; gap: 2px;
  }
  .menu button {
    border: none; background: none; text-align: left; width: 100%;
    padding: 7px 10px; border-radius: 5px; font-size: 13px; color: var(--text);
  }
  .menu button:hover:not(:disabled) { background: var(--hover); border-color: transparent; }
  .menu button.danger { color: var(--err); }
  .menu .ask { padding: 7px 10px 4px; color: var(--dim); font-size: 12px; }
  .menu .row { display: flex; gap: 4px; padding: 0 4px 2px; }
  .menu .row button { flex: 1; text-align: center; }
  .sidebar .foot {
    border-top: 1px solid var(--border); padding: 8px;
    display: flex; gap: 6px; align-items: center;
  }
  .sidebar .foot .path {
    flex: 1; color: var(--dim); font-size: 11px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left;
  }

  /* ================= 右侧对话区 ================= */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat > header {
    display: flex; align-items: center; gap: 10px; padding: 9px 16px;
    border-bottom: 1px solid var(--border); flex: none;
    background: var(--grad-panel);
  }
  #toggleSide { display: none; }
  .chat > header .now {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--dim); font-size: 13px;
  }

  main { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
  .wrap { max-width: 800px; margin: 0 auto; }

  .user-msg {
    background: var(--grad-bubble); border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    border-radius: 10px; padding: 10px 14px; margin: 18px 0;
    white-space: pre-wrap; word-break: break-word;
  }
  .who { color: var(--dim); font-size: 12px; margin-bottom: 4px; }

  .step-block { margin: 10px 0; }
  .step-line {
    display: flex; align-items: center; gap: 10px;
    color: var(--dim); font-size: 12px; margin: 14px 0 8px;
  }
  .step-line::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }
  /* 模型输出按 Markdown 渲染。注意这里**不能**用 white-space: pre-wrap ——
     换行由渲染器产生的 <br> / 块级元素负责，两者叠加会多出一倍空行 */
  .text-out { word-break: break-word; margin: 8px 0; }
  .text-out > :first-child { margin-top: 0; }
  .text-out > :last-child { margin-bottom: 0; }
  .text-out p { margin: 8px 0; }
  .text-out h1, .text-out h2, .text-out h3,
  .text-out h4, .text-out h5, .text-out h6 {
    margin: 18px 0 8px; line-height: 1.3;
  }
  .text-out h1 { font-size: 1.4em; }
  .text-out h2 { font-size: 1.22em; }
  .text-out h3 { font-size: 1.1em; }
  .text-out h4, .text-out h5, .text-out h6 { font-size: 1em; }
  .text-out ul, .text-out ol { margin: 8px 0; padding-left: 24px; }
  .text-out li { margin: 3px 0; }
  .text-out blockquote {
    margin: 10px 0; padding: 2px 12px; border-left: 3px solid var(--border);
    color: var(--dim);
  }
  .text-out a { color: var(--accent); }
  .text-out hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .text-out code {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-size: .89em;
  }
  .text-out pre {
    position: relative; margin: 10px 0; padding: 12px 14px; overflow: auto;
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  }
  .text-out pre code {
    background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.55;
  }
  .text-out pre .lang {
    position: absolute; top: 6px; right: 62px; color: var(--dim); font-size: 11px;
  }
  .text-out pre .copy {
    position: absolute; top: 4px; right: 6px; font-size: 11px; padding: 2px 8px;
    opacity: 0; transition: opacity .12s;
  }
  .text-out pre:hover .copy { opacity: 1; }

  .tool {
    border: 1px solid var(--border); border-radius: 8px; margin: 6px 0;
    background: var(--panel); background-image: var(--grad-card);
    overflow: hidden;
  }
  .tool > summary {
    cursor: pointer; padding: 7px 12px; display: flex; gap: 10px;
    align-items: baseline; list-style: none; font-size: 13px;
  }
  .tool > summary::-webkit-details-marker { display: none; }
  .tool > summary::before { content: "▸"; color: var(--dim); font-size: 11px; }
  .tool[open] > summary::before { content: "▾"; }
  .tool .name { font-weight: 600; }
  .tool .args { color: var(--dim); overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; flex: 1; }
  .tool .from { color: var(--accent); font-size: 11px; }
  .tool .state { font-size: 11px; }
  .tool pre {
    margin: 0; padding: 10px 12px; border-top: 1px solid var(--border);
    background: var(--code-bg); font-size: 12px; line-height: 1.5;
    max-height: 340px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  .ok { color: var(--ok); } .fail { color: var(--err); } .run { color: var(--warn); }

  .perm {
    border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent);
    border-radius: 8px; padding: 12px 14px; margin: 12px 0;
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--warn) 16%, transparent),
      color-mix(in srgb, var(--warn) 4%, transparent));
  }
  .perm .title { font-weight: 600; margin-bottom: 4px; }
  .perm .body { color: var(--dim); font-size: 13px; margin-bottom: 10px;
                white-space: pre-wrap; word-break: break-word; }
  .perm .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .note {
    border-left: 3px solid var(--err); padding: 8px 12px; margin: 12px 0;
    border-radius: 0 6px 6px 0;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--err) 15%, transparent),
      color-mix(in srgb, var(--err) 3%, transparent));
  }
  /* 记忆写入用强调色，和报错的红区分开 —— 它是个好事情 */
  .note.memo { border-left-color: var(--accent); background: var(--grad-bubble); }
  .memo-files { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .note .partial { color: var(--dim); font-size: 13px; white-space: pre-wrap;
                   margin-top: 8px; max-height: 240px; overflow: auto; }
  .meta { color: var(--dim); font-size: 12px; margin: 10px 0 0; }
  .empty {
    color: var(--dim); text-align: center; margin-top: 22vh; font-size: 15px;
  }
  .empty kbd {
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 6px; font-family: inherit; font-size: 12px;
  }

  footer {
    flex: none; border-top: 1px solid var(--border);
    background: var(--grad-panel);
  }
  .composer { max-width: 800px; margin: 0 auto; padding: 12px 16px;
              display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font: inherit; min-height: 42px; max-height: 200px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  /* ================= 设置抽屉 ================= */
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 360px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .18s ease;
    display: flex; flex-direction: column; z-index: 20;
  }
  .drawer.open { transform: none; }
  .drawer > header {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); font-weight: 600;
  }
  .drawer .body { padding: 16px; overflow-y: auto; flex: 1; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; margin-bottom: 4px; }
  .field .hint { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .field input {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; font-family: inherit; font-size: 13px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .switch {
    display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px;
  }
  .switch input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; }
  .seg button.on { border-color: var(--accent); color: var(--accent); }
  .ro { color: var(--dim); font-size: 12px; word-break: break-all;
        white-space: pre-wrap; line-height: 1.7; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--raised); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 16px; font-size: 13px; z-index: 30; opacity: 0;
    transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* 窄屏：会话栏变成浮层，用按钮唤起 */
  @media (max-width: 720px) {
    .sidebar { position: fixed; z-index: 15; height: 100%; margin-left: -264px; }
    .sidebar.open { margin-left: 0; box-shadow: 0 0 40px rgba(0,0,0,.4); }
    #toggleSide { display: inline-block; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="top">
    <div class="brand"><span>xxCode</span><span class="ver">Runtime V1</span></div>
    <button class="primary" id="newChat">＋ 新会话</button>
  </div>
  <div class="side-list" id="convList"></div>
  <div class="foot">
    <span class="path" id="rootPath"></span>
    <button id="openSettings" title="设置">⚙</button>
  </div>
</aside>

<div class="chat">
  <header>
    <button id="toggleSide" title="会话列表">☰</button>
    <span class="now" id="nowTitle">新会话</span>
  </header>

  <main id="main"><div class="wrap" id="log"></div></main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="primary" id="send">发送</button>
    </div>
  </footer>
</div>

<aside class="drawer" id="drawer">
  <header>
    <span>设置</span><span style="flex:1"></span>
    <button id="closeSettings">关闭</button>
  </header>
  <div class="body">
    <div class="field">
      <label>主题</label>
      <div class="seg">
        <button data-theme-set="dark">深色</button>
        <button data-theme-set="light">浅色</button>
      </div>
      <div class="hint">存在浏览器本地，不写进 .env</div>
    </div>

    <div id="fields"></div>

    <button class="primary" id="saveSettings" style="width:100%">保存到 .env</button>
    <div class="hint" style="margin-top:8px">改动对新会话生效，进行中的会话不受影响。</div>

    <div style="margin-top:22px">
      <label style="font-size:13px">当前环境</label>
      <div class="ro" id="readonly" style="margin-top:6px"></div>
    </div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script src="/static/markdown.js"></script>
<script>
"use strict";

/* 字段说明放前端而不是后端：「怎么解释这个配置」是给人看的文案，
   和「能不能改」（后端 EDITABLE_KEYS 白名单）是两件事。 */
const FIELD_SPEC = {
  EXTRACT_MEMORY:           { label: "每轮自动提取长期记忆", type: "bool",
                              hint: "对话结束后自动看看这轮有没有值得长期记住的东西。" +
                                    "代价是每轮多一次 LLM 调用" },
  LLM_MODEL:                { label: "模型", type: "text",
                              hint: "例如 deepseek-chat / deepseek-reasoner" },
  MAX_STEPS:                { label: "最大循环步数", type: "number",
                              hint: "超过就中止并返回最后的进展" },
  COMPACT_THRESHOLD_TOKENS: { label: "上下文压缩阈值", type: "number",
                              hint: "上一次调用的 prompt 超过这个数就压缩" },
  CONSOLIDATE_MIN_HOURS:    { label: "记忆整理·最小间隔（小时）", type: "number" },
  CONSOLIDATE_MIN_SESSIONS: { label: "记忆整理·最小新会话数", type: "number" },
};

const state = {
  sessionId: null, busy: false, stepBlock: null, toolCards: {}, sessions: [],
};

const $ = (id) => document.getElementById(id);
const log = $("log");

// ---------------------------------------------------------------- 主题

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("xxcode-theme", theme);
  document.querySelectorAll("[data-theme-set]").forEach((b) =>
    b.classList.toggle("on", b.dataset.themeSet === theme));
}
setTheme(localStorage.getItem("xxcode-theme") || "dark");
document.querySelectorAll("[data-theme-set]").forEach((b) =>
  b.addEventListener("click", () => setTheme(b.dataset.themeSet)));

// ---------------------------------------------------------------- 小工具

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2600);
}

/** 建元素。默认用 textContent —— 模型输出和工具结果都是不可信内容。
 *  只有渲染 Markdown 时才用 innerHTML，而那条路上的内容是先转义过的。 */
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

/** 边流边渲染。
 *  每来一小段就整体重解析是 O(n²)，但单条回复通常只有几 KB，无所谓。
 *  真要慢下来再加节流，不提前优化。 */
function setRichText(node, raw) {
  node._raw = raw;
  node.innerHTML = renderMarkdown(raw);
}

// 代码块的「复制」按钮：从答案里拷代码是最高频的动作
log.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  const code = btn.closest("pre").querySelector("code");
  navigator.clipboard.writeText(code.textContent).then(
    () => { btn.textContent = "已复制"; setTimeout(() => (btn.textContent = "复制"), 1200); },
    () => toast("复制失败，手动选一下吧"),
  );
});

const scrollDown = () => { $("main").scrollTop = $("main").scrollHeight; };

function humanTokens(n) {
  return n < 1000 ? String(n) : (n / 1000).toFixed(1) + "k";
}

/** 「今天 / 昨天 / N 天前 / 9月19日」—— 列表按这个分组。 */
function dayLabel(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "更早";
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const diff = Math.round((day(new Date()) - day(d)) / 86400000);
  if (diff <= 0) return "今天";
  if (diff === 1) return "昨天";
  if (diff < 7) return `${diff} 天前`;
  return d.toLocaleDateString("zh-CN", { month: "long", day: "numeric" });
}

// ---------------------------------------------------------------- 会话列表

async function loadSessions() {
  state.sessions = await (await fetch("/api/sessions")).json();
  renderSidebar();
}

function renderSidebar() {
  const list = $("convList");
  list.innerHTML = "";
  if (state.sessions.length === 0) {
    list.append(el("div", "day", "还没有对话"));
    return;
  }

  let lastDay = null;
  // 服务端已经滤过空会话，这里再挡一道 —— 万一连的是没更新的服务进程
  for (const s of state.sessions.filter((x) => x.message_count > 0)) {
    const day = dayLabel(s.started_at);
    if (day !== lastDay) {
      list.append(el("div", "day", day));
      lastDay = day;
    }

    const row = el("div", "conv" + (s.session_id === state.sessionId ? " active" : ""));
    // 就显示第一句提问。条数 / tokens / 时间放进 title，悬停才看 ——
    // 列表是用来「认出是哪次对话」的，不是用来读统计的
    row.append(el("span", "title", s.title));
    row.title = s.title + "\n" + s.started_at.replace("T", " ") +
                ` · ${s.message_count} 条` +
                (s.total_tokens ? ` · ${humanTokens(s.total_tokens)} tokens` : "");

    // 「⋯」平时藏着，鼠标移到这条上才出现
    const more = el("button", "more", "⋯");
    more.title = "更多";
    more.onclick = (e) => {
      e.stopPropagation();   // 别让点击穿透到「切换会话」上去
      openConvMenu(more, s);
    };
    row.append(more);

    row.onclick = () => {
      if (state.busy) return toast("正在跑，等它结束再切");
      $("sidebar").classList.remove("open");
      switchTo(s.session_id);
    };
    list.append(row);
  }
}

async function switchTo(sessionId) {
  state.sessionId = sessionId;
  state.stepBlock = null;
  state.toolCards = {};
  log.innerHTML = "";
  renderSidebar();

  const msgs = await (await fetch(`/api/sessions/${sessionId}/messages`)).json();
  $("nowTitle").textContent =
    state.sessions.find((s) => s.session_id === sessionId)?.title || "新会话";

  if (msgs.length === 0) {
    const empty = el("div", "empty");
    empty.append(el("div", null, "问点什么吧"));
    log.append(empty);
  } else {
    for (const m of msgs) {
      if (m.role === "user") addUser(m.text);
      else {
        const block = el("div", "step-block");
        const out = el("div", "text-out");
        setRichText(out, m.text);   // 历史消息也要按 Markdown 渲染
        block.append(out);
        log.append(block);
        state.stepBlock = block;
      }
    }
    addMeta("—— 以上是历史。接着问吧。——");
  }
  scrollDown();
  refreshConfig();
}

// ---------------------------------------------------------------- 会话菜单

let openMenuEl = null;

function closeMenu() {
  if (!openMenuEl) return;
  openMenuEl.remove();
  openMenuEl = null;
  document.querySelectorAll(".conv .more.on").forEach((b) => b.classList.remove("on"));
}

/** 菜单挂在 body 上、用 fixed 定位。放列表里会被 overflow 裁掉 —— 尤其是最后一条。 */
function openMenu(anchor, build) {
  closeMenu();
  const menu = el("div", "menu");
  build(menu);
  document.body.append(menu);

  const r = anchor.getBoundingClientRect();
  // 贴着「⋯」右侧展开；快出界就翻到左边 / 往上收
  menu.style.left = Math.max(8, Math.min(r.right + 6, window.innerWidth - menu.offsetWidth - 8)) + "px";
  menu.style.top = Math.max(8, Math.min(r.bottom + 4, window.innerHeight - menu.offsetHeight - 8)) + "px";

  openMenuEl = menu;
  anchor.classList.add("on");
  return menu;
}

function openConvMenu(anchor, session) {
  openMenu(anchor, (menu) => {
    const del = el("button", "danger", "删除会话");
    del.onclick = (e) => { e.stopPropagation(); askDelete(menu, session); };
    menu.append(del);
  });
}

function askDelete(menu, session) {
  // 二次确认直接在菜单里换内容。删对话不可逆，而且列表里几条标题长得很像，
  // 点错太正常了 —— 用系统 confirm() 也行，但那个框太丑且拦不住误点
  menu.innerHTML = "";
  menu.append(el("div", "ask", "删除这条对话？不可恢复。"));
  const row = el("div", "row");
  const yes = el("button", "danger", "删除");
  const no = el("button", null, "取消");
  yes.onclick = (e) => { e.stopPropagation(); closeMenu(); doDelete(session); };
  no.onclick = (e) => { e.stopPropagation(); closeMenu(); };
  row.append(yes, no);
  menu.append(row);
}

async function doDelete(session) {
  try {
    const resp = await fetch(`/api/sessions/${session.session_id}`, { method: "DELETE" });
    if (!resp.ok) {
      toast("删除失败：" + ((await resp.json()).detail || resp.statusText));
      return;
    }
  } catch (e) {
    toast("删除失败：" + e.message);
    return;
  }

  const wasActive = session.session_id === state.sessionId;
  if (wasActive) state.sessionId = null;
  await loadSessions();

  // 删掉的正是在看的那条：切到列表里最近的一条，没有就开个新的
  if (wasActive) {
    if (state.sessions.length) await switchTo(state.sessions[0].session_id);
    else await newChat();
  }
  toast("已删除");
}

// 点别处 / 按 Esc 就收起菜单
document.addEventListener("click", (e) => {
  if (openMenuEl && !openMenuEl.contains(e.target)) closeMenu();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeMenu();
});

$("newChat").onclick = async () => {
  if (state.busy) return toast("正在跑，等它结束");
  await newChat();
};

async function newChat() {
  const { session_id } = await (await fetch("/api/sessions", { method: "POST" })).json();
  state.sessions = [];           // 强制重新拉，新会话才会出现在列表里
  await loadSessions();
  await switchTo(session_id);
}

$("toggleSide").onclick = () => $("sidebar").classList.toggle("open");

// ---------------------------------------------------------------- 渲染

function addUser(text) {
  const box = el("div", "user-msg");
  box.append(el("div", "who", "你"), el("div", null, text));
  log.append(box);
  state.stepBlock = null;   // 下一轮重新开块
  scrollDown();
}

function addStep(step, maxSteps) {
  const block = el("div", "step-block");
  block.append(el("div", "step-line", `step ${step}/${maxSteps}`));
  log.append(block);
  state.stepBlock = block;
  scrollDown();
}

function currentOut() {
  const block = state.stepBlock;
  if (!block) return null;
  let out = block.querySelector(".text-out:last-child");
  if (!out || block.lastElementChild !== out) {
    out = el("div", "text-out");
    block.append(out);
  }
  return out;
}

function addDelta(text) {
  const out = currentOut();
  if (!out) return;
  setRichText(out, (out._raw || "") + text);
  scrollDown();
}

function addToolCall(data) {
  const details = el("details", "tool");
  const summary = el("summary");
  summary.append(el("span", "name", data.name));
  if (data.source) summary.append(el("span", "from", data.source));
  summary.append(
    el("span", "args mono", prettyArgs(data.arguments)),
    el("span", "state run", "运行中…"),
  );
  details.append(summary, el("pre", null, "等待结果…"));
  (state.stepBlock || log).append(details);
  state.toolCards[data.call_id] = details;
  scrollDown();
}

function addToolResult(data) {
  const keys = Object.keys(state.toolCards);
  const card = state.toolCards[data.call_id] || state.toolCards[keys[keys.length - 1]];
  if (!card) return;
  const badge = card.querySelector(".state");
  badge.textContent = data.ok ? "完成" : "失败";
  badge.className = "state " + (data.ok ? "ok" : "fail");
  card.querySelector("pre").textContent =
    data.text + (data.truncated ? "\n…（已截断）" : "");
  scrollDown();
}

function prettyArgs(raw) {
  try {
    return Object.entries(JSON.parse(raw)).map(([k, v]) => {
      let s = typeof v === "string" ? v : JSON.stringify(v);
      if (s.length > 70) s = s.slice(0, 70) + "…";
      return `${k}: ${s}`;
    }).join("  ");
  } catch { return raw; }
}

function addPermission(data) {
  const box = el("div", "perm");
  box.append(el("div", "title", "⚠ 需要授权"), el("div", "body", data.summary));
  const actions = el("div", "actions");

  const decide = async (decision) => {
    box.remove();
    try {
      await fetch(`/api/permission/${data.request_id}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decision }),
      });
    } catch (e) { toast("回复授权失败：" + e.message); }
  };

  const once = el("button", "primary", "允许一次");
  once.onclick = () => decide("allow_once");
  const sess = el("button", null, "本会话允许这类");
  sess.onclick = () => decide("allow_session");
  const deny = el("button", null, "拒绝");
  deny.onclick = () => decide("deny");
  actions.append(once, sess, deny);
  box.append(actions);
  (state.stepBlock || log).append(box);
  scrollDown();
}

function addMemory(data) {
  const who = data.phase === "extract" ? "记忆提取" : "记忆整理";

  if (data.status === "running") {
    log.append(el("div", "meta", `${who}中…（${data.reason}）`));
    scrollDown();
    return;
  }
  if (data.status !== "done") {
    log.append(el("div", "meta", `${who}失败：${data.message || ""}`));
    scrollDown();
    return;
  }

  // 提取跑完但什么都没记，是最常见的情况 —— 一行轻描淡写就好，
  // 不要每次都糊一大块东西在对话末尾
  if (!data.changed.length) {
    log.append(el("div", "meta", `${who}：这轮没有值得长期保存的信息`));
    scrollDown();
    return;
  }

  const box = el("div", "note memo");
  box.append(el("div", null, `${who} · 写入 ${data.changed.length} 条记忆`));
  box.append(el("div", "memo-files mono", data.changed.join("  ")));
  if (data.summary) box.append(el("div", "partial", data.summary));
  log.append(box);
  scrollDown();
}

function addError(data) {
  const box = el("div", "note");
  box.append(el("div", null, "出错了：" + data.message));
  if (data.partial) {
    box.append(el("div", "partial", "它中断前的最后进展：\n" + data.partial));
  }
  log.append(box);
  scrollDown();
}

const addMeta = (text) => { log.append(el("div", "meta", text)); scrollDown(); };

// ---------------------------------------------------------------- 对话

async function send() {
  const input = $("input");
  const question = input.value.trim();
  if (!question || state.busy) return;

  const empty = log.querySelector(".empty");
  if (empty) empty.remove();

  addUser(question);
  input.value = "";
  autoGrow();

  state.busy = true;
  $("send").disabled = true;

  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: state.sessionId, question }),
    });
    if (!resp.ok) {
      addError({ message: (await resp.json()).detail || resp.statusText });
      return;
    }

    // 手动读流，**不用 EventSource** —— 它断线会自动重连，
    // 那会把同一个问题重跑一遍
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const raw = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        const type = (raw.match(/^event: (.*)$/m) || [])[1];
        const payload = (raw.match(/^data: (.*)$/m) || [])[1];
        if (type && payload) handleEvent(type, JSON.parse(payload));
      }
    }
  } catch (e) {
    addError({ message: "连接中断：" + e.message });
  } finally {
    state.busy = false;
    $("send").disabled = false;
    await loadSessions();   // 标题、条数、tokens 都会变
  }
}

function handleEvent(type, data) {
  switch (type) {
    case "step":        addStep(data.step, data.max_steps); break;
    case "delta":       addDelta(data.text); break;
    case "tool_call":   addToolCall(data); break;
    case "tool_result": addToolResult(data); break;
    case "permission":  addPermission(data); break;
    case "error":       addError(data); break;
    case "done":
      addMeta(`完成 · ${humanTokens(data.total_tokens)} tokens · ${data.calls} 次调用`);
      break;
    case "memory": addMemory(data); break;
  }
}

function autoGrow() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
}

$("input").addEventListener("input", autoGrow);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("send").onclick = send;

// ---------------------------------------------------------------- 设置

$("openSettings").onclick = () => { $("drawer").classList.add("open"); refreshConfig(); };
$("closeSettings").onclick = () => $("drawer").classList.remove("open");

async function refreshConfig() {
  let cfg;
  try { cfg = await (await fetch("/api/config")).json(); }
  catch { return; }

  const fields = $("fields");
  if (!fields.dataset.built) {
    for (const [key, spec] of Object.entries(FIELD_SPEC)) {
      const box = el("div", "field");
      const input = el("input");
      input.id = "cfg-" + key;

      if (spec.type === "bool") {
        // 用一个可点的行，而不是裸 checkbox —— 这一栏的点法和其他项一致
        const row = el("label", "switch");
        input.type = "checkbox";
        row.append(input, el("span", null, spec.label));
        box.append(row);
      } else {
        box.append(el("label", null, spec.label));
        input.type = spec.type;
        box.append(input);
      }
      if (spec.hint) box.append(el("div", "hint", spec.hint));
      fields.append(box);
    }
    fields.dataset.built = "1";
  }
  for (const [key, value] of Object.entries(cfg.editable)) {
    const input = $("cfg-" + key);
    if (!input || document.activeElement === input) continue;
    if (FIELD_SPEC[key]?.type === "bool") input.checked = value === true;
    else input.value = value;
  }

  $("rootPath").textContent = cfg.readonly.root;
  $("rootPath").title = cfg.readonly.root;
  $("readonly").textContent =
    `root     ${cfg.readonly.root}\n` +
    `接口     ${cfg.readonly.llm_base_url}\n` +
    `配置文件 ${cfg.readonly.env_file}\n` +
    `长期记忆 ${cfg.readonly.memory_count} 条`;
}

$("saveSettings").onclick = async () => {
  const values = {};
  for (const key of Object.keys(FIELD_SPEC)) {
    const input = $("cfg-" + key);
    if (FIELD_SPEC[key].type === "bool") values[key] = input.checked;
    else if (input.value.trim() !== "") values[key] = input.value.trim();
  }
  const resp = await fetch("/api/config", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ values }),
  });
  const body = await resp.json();
  toast(resp.ok ? body.note : ("保存失败：" + body.detail));
  if (resp.ok) refreshConfig();
};

// ---------------------------------------------------------------- 启动

(async function boot() {
  await loadSessions();
  const first = state.sessions[0];
  if (first) {
    await switchTo(first.session_id);
  } else {
    const { session_id } = await (await fetch("/api/sessions", { method: "POST" })).json();
    await loadSessions();
    await switchTo(session_id);
  }
  $("input").focus();
})();
</script>
</body>
